<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ARISE RPG" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="theme-color" content="#07080c" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>ARISE: Shadow Monarch</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #07080c;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Force landscape orientation when device is held in portrait */
    @media screen and (orientation: portrait) {
      #root {
        width: 100vh !important;
        width: 100dvh !important;
        height: 100vw !important;
        height: 100dvw !important;
        transform: rotate(90deg) translateY(-100%) !important;
        transform-origin: top left !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        overflow: hidden !important;
      }
    }

    @media screen and (orientation: landscape) {
      #root {
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        position: relative !important;
        overflow: hidden !important;
      }
    }
  </style>
  <script>
    (function() {
      function lockLandscape() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function() {});
          } else if (screen.lockOrientation) {
            screen.lockOrientation('landscape');
          } else if (screen.mozLockOrientation) {
            screen.mozLockOrientation('landscape');
          } else if (screen.msLockOrientation) {
            screen.msLockOrientation('landscape');
          }
        } catch (e) {}
      }

      // Try immediately on script evaluation
      lockLandscape();
      window.addEventListener('DOMContentLoaded', lockLandscape);
      window.addEventListener('load', lockLandscape);

      // On first touch/gesture, re-attempt lock
      ['touchstart', 'pointerdown', 'click'].forEach(function(evt) {
        window.addEventListener(evt, lockLandscape, { passive: true, once: true });
      });
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
