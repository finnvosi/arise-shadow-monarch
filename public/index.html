<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ARISE RPG" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="theme-color" content="#07080c" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>ARISE: Shadow Monarch</title>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      background: #07080c;
      overflow: hidden;
      touch-action: manipulation;
    }

    #root {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      background-color: #07080c;
      overflow: hidden !important;
      z-index: 1;
    }

    /* Force landscape orientation when device is held in portrait */
    @media screen and (orientation: portrait) {
      #root {
        width: 100vh !important;
        width: 100lvh !important;
        width: 100vmax !important;
        height: 100vw !important;
        height: 100lvw !important;
        height: 100vmin !important;
        transform: rotate(90deg) translateY(-100%) !important;
        transform-origin: top left !important;
      }
    }

    @media screen and (orientation: landscape) {
      #root {
        width: 100vw !important;
        width: 100% !important;
        height: 100vh !important;
        height: 100% !important;
        transform: none !important;
      }
    }
  </style>
  <script>
    (function() {
      function lockLandscape() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function() {});
          } else if (screen.lockOrientation) {
            screen.lockOrientation('landscape');
          } else if (screen.mozLockOrientation) {
            screen.mozLockOrientation('landscape');
          } else if (screen.msLockOrientation) {
            screen.msLockOrientation('landscape');
          }
        } catch (e) {}
      }

      function syncScreenBounds() {
        try {
          const root = document.getElementById('root');
          if (!root) return;
          const isPortrait = window.matchMedia('(orientation: portrait)').matches || window.innerHeight > window.innerWidth;
          if (isPortrait) {
            root.style.width = window.innerHeight + 'px';
            root.style.height = window.innerWidth + 'px';
          } else {
            root.style.width = '100vw';
            root.style.height = '100vh';
          }
        } catch (e) {}
      }

      // Try immediately on script evaluation
      lockLandscape();
      syncScreenBounds();
      window.addEventListener('DOMContentLoaded', () => { lockLandscape(); syncScreenBounds(); });
      window.addEventListener('load', () => { lockLandscape(); syncScreenBounds(); });
      window.addEventListener('resize', syncScreenBounds);
      window.addEventListener('orientationchange', () => { lockLandscape(); syncScreenBounds(); });

      // On first touch/gesture, re-attempt lock & sync
      ['touchstart', 'pointerdown', 'click'].forEach(function(evt) {
        window.addEventListener(evt, () => { lockLandscape(); syncScreenBounds(); }, { passive: true, once: true });
      });
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
